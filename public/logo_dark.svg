<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48">
  <!-- Hapilot Logo for dark backgrounds -->
  <defs>
    <linearGradient id="icon-bg-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81AB28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9BC73A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="2" y="4" width="40" height="40" rx="10" ry="10" fill="url(#icon-bg-d)" />
  <text x="22" y="34" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">H</text>
  <text x="52" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#e0e0e0" text-anchor="start">Hapilot</text>
</svg>
