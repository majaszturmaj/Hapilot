<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- System Hapilot Assistant Avatar -->
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81AB28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B8F20;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="40" cy="40" r="40" fill="url(#avatar-bg)" />
  <!-- Letter K -->
  <text x="40" y="54" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="bold" fill="white" text-anchor="middle">K</text>
</svg>
