<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hapilot Agent Favicon -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81AB28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B8F20;stop-opacity:1" />
