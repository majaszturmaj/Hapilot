# sandbox/docker-compose.yml

services:
  python_sandbox:
    build: .
    # Removed explicit container_name to avoid global name collisions.
    # Compose will name the container based on the project and service.
    volumes:
      # Mapujemy folder lokalny, żebyś mogła widzieć pliki wygenerowane przez Agenta (np. wykresy)
      - ./workspace:/workspace
    # Limity zasobów (opcjonalnie, żeby Agent nie zjadł całego RAMu przy pętli nieskończonej)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import sys; sys.exit(0)\""]
      interval: 30s
      timeout: 10s
      retries: 3
