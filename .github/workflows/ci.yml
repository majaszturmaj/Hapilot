# Unit tests and lint on every push and pull request. No model, no GPU, no network access
# from the tests themselves (the egress guard in tests/conftest.py blocks it).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: ruff check src extensions tests scripts tools
      - run: pytest -q
