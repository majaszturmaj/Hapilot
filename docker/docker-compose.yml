services:
  # --- BAZA WIEDZY (ChromaDB) ---
  chromadb:
    image: chromadb/chroma:latest
    container_name: hapilot_chroma
    ports:
      - "8000:8000"
    volumes:
      - ../chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - hapilot_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- AUTOMATYZACJA (n8n) ---
  n8n:
    image: n8nio/n8n
    container_name: hapilot_n8n
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5679/
      # Zwiększ timeout dla startupowego healthchecka
      - N8N_STARTUP_TIMEOUT=600
    volumes:
      - ../n8n_data:/home/node/.n8n
    networks:
      - hapilot_net
    restart: unless-stopped
    # n8n healthcheck (większy timeout ze względu na długi startup)
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:5678/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  hapilot_net:
    driver: bridge

