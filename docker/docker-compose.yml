# Optional services for Hapilot. The knowledge base (ChromaDB) is embedded in the Hapilot process
# and the code sandbox is started per run by Hapilot itself, so nothing here is required.
#
# n8n (Outlook e-mail drafts / calendar) runs only with the "n8n" profile:
#   docker compose -f docker/docker-compose.yml --profile n8n up -d
# The project name "hapilot" keeps these containers separate from anything else on the host.
name: hapilot

services:
  n8n:
    image: ${HAPILOT_N8N_IMAGE:-n8nio/n8n:latest}
    profiles: ["n8n"]
    ports:
      - "127.0.0.1:${HAPILOT_N8N_PORT:-8678}:5678"
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://127.0.0.1:${HAPILOT_N8N_PORT:-8678}/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
    volumes:
      - ../var/n8n:/home/node/.n8n
    restart: unless-stopped
